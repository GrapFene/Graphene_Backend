services:

  backend-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/grapfene/graphene_backend:latest

    environment:
      NODE_ENV: production
      PORT: "3000"
      SUPABASE_URL:         ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FEDERATION_PRIVATE_KEY: ${FEDERATION_PRIVATE_KEY}
      INSTANCE_DOMAIN:        ${INSTANCE_DOMAIN}

    expose:
      - "3000"

    networks:
      - graphene-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  frontend-app:
    image: ${FRONTEND_GHCR_IMAGE}

    expose:
      - "80"

    networks:
      - graphene-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s


  caddy:
    image: caddy:2-alpine

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - graphene-net

    restart: unless-stopped

    depends_on:
      - backend-app
      - frontend-app


volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local


networks:
  graphene-net:
    driver: bridge
