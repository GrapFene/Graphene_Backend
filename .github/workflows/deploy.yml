name: Backend — Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/grapfene/graphene_backend

jobs:

  build-and-push:
    name: Build → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha_tag: ${{ steps.sha.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Graphene Backend
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max


  deploy-to-vm:
    name: Deploy → Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy orchestrator files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port:     22
          source:   "docker-compose.yml,Caddyfile"
          target:   ${{ secrets.VM_PROJECT_DIR }}

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.sha_tag }}
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port:     22
          envs:     IMAGE_TAG
          script: |
            set -euo pipefail

            echo "${{ secrets.GHCR_PAT }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker pull "$IMAGE_TAG"

            cd "${{ secrets.VM_PROJECT_DIR }}"

            echo "GHCR_IMAGE=$IMAGE_TAG" > .env.deploy

            docker compose \
              --env-file .env \
              --env-file .env.deploy \
              up -d --pull always --remove-orphans

            docker image prune -f

            echo "✅ Deployed $IMAGE_TAG"
            docker compose ps
